<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽籤檢定</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- 芫荽 (Iansui) 繁體中文 Web Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-iansui@1.0.0/iansui.min.css">

  <style>
    /* 全螢幕規範：嚴格 100vh 零滾動條 */
    html, body {
      height: 100%;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      user-select: none;
      -webkit-user-select: none;
      background-color: #ffffff;
      color: #111827;
    }

    .font-iansui {
      font-family: 'Iansui', '芫荽', 'Noto Serif TC', serif;
    }

    /* 經典硬派白底線條 (Brutalist White) */
    .slot-machine-box {
      background: #ffffff;
      border: 4px solid #111827;
      box-shadow: 8px 8px 0px #111827;
    }

    .slot-btn {
      border: 2px solid #111827;
      box-shadow: 3px 3px 0px #111827;
      transition: all 0.08s ease;
    }
    .slot-btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #111827;
    }
    .slot-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #111827;
    }

    /* 拉霸機滾輪視窗：高透光柔和邊緣，上下鄰居卡牌清晰可見且絕不留白 */
    .reel-viewport {
      position: relative;
      overflow: hidden;
      background: #ffffff;
      border: 3px solid #111827;
    }
    .reel-viewport::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28%;
      background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.45) 60%, rgba(255,255,255,0) 100%);
      z-index: 10;
      pointer-events: none;
    }
    .reel-viewport::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 28%;
      background: linear-gradient(0deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.45) 60%, rgba(255,255,255,0) 100%);
      z-index: 10;
      pointer-events: none;
    }

    /* 中央瞄準紅線區 (高 130px) */
    .reel-center-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      height: 130px;
      border-top: 3px dashed #dc2626;
      border-bottom: 3px dashed #dc2626;
      background: rgba(239, 68, 68, 0.04);
      z-index: 8;
      pointer-events: none;
    }

    /* 機械式立體拉桿 (3D Mechanically Realistic Lever) */
    .lever-assembly {
      perspective: 600px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .lever-arm {
      transform-origin: 50% 90%;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .lever-pulled .lever-arm {
      transform: rotateX(55deg) translateY(38px) scaleY(0.85);
      transition: transform 0.14s ease-in;
    }
    .lever-socket {
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
    }

    /* 定格震動 */
    @keyframes screenShock {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-2px, 2px); }
      100% { transform: translate(0, 0); }
    }
    .shock-effect {
      animation: screenShock 0.26s ease-out;
    }

    /* 主題卡片 Hover 效果 */
    .theme-card {
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .theme-card:hover {
      transform: translateY(-4px);
      box-shadow: 10px 10px 0px #111827;
    }
  </style>
</head>
<body id="appBody" class="bg-white text-gray-900 flex flex-col justify-between h-screen w-screen overflow-hidden relative">

        <!-- 主題 1：English Show Time -->
        <div id="themeEnglishCard" class="theme-card bg-white border-4 border-gray-900 rounded-2xl p-4 cursor-pointer flex flex-col items-center gap-3 shadow-[6px_6px_0px_#111827]">

      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
      },
      click() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.03);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.03);
        } catch(e) {}
      },
      lever() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();

          osc.type = 'sawtooth';

    /**
     * 設置靜止狀態下之飽滿視野：
     * 前置 3 個項目 + 目標項目 (索引 3) + 後置 3 個項目，
     * 讓可見視窗上、中、下完全被相鄰卡牌填滿，文字絕不消失、絕不留白。
     */
    function setupReelStaticView(bandElem, baseList, centerItem, renderFn) {
      if (!baseList || baseList.length === 0) {
        bandElem.innerHTML = '';
        return;
      }
      const N = baseList.length;
      let centerIdx = baseList.findIndex(it => (it.id || it) === (centerItem.id || centerItem));
      if (centerIdx < 0) centerIdx = 0;

      const PRE = 3;
      const POST = 3;
      const staticSequence = [];
      for (let i = -PRE; i <= POST; i++) {
        const idx = (centerIdx + i + (N * 20)) % N;
        staticSequence.push(baseList[idx]);
      }

      buildReelDOM(bandElem, staticSequence, renderFn);

      const containerHeight = bandElem.parentElement.clientHeight || (ITEM_HEIGHT * 3);
      const centerOffset = (containerHeight / 2) - (ITEM_HEIGHT / 2);
      const targetY = -(PRE * ITEM_HEIGHT) + centerOffset;

      bandElem.style.transition = 'none';
      bandElem.style.transform = `translateY(${targetY}px)`;
    }

    function refreshCurrentStudentReel() {
      let pool = [];
      if (appMode === 'twoStep' && lockedClass && enabledClasses.has(lockedClass)) {
        pool = STUDENTS.filter(s => s.class === lockedClass).sort((a, b) => a.seat - b.seat);
      } else {
        pool = STUDENTS.filter(s => enabledClasses.has(s.class)).sort((a, b) => a.id.localeCompare(b.id));
      }

      if (pool.length > 0) {
        if (!pool.some(s => s.id === currentStudentItem.id)) {
          currentStudentItem = pool[0];
        }
        setupReelStaticView(reelStudentBand, pool, currentStudentItem, renderStudentItemHTML);
      }
    }

    /**
     * 升級回彈物理動力學引擎：
     * 1. 緩衝項目：目標後方連續推入 POST_BUFFER_COUNT = 20 個依照順序循環銜接的卡牌。
     * 2. 階段一：平滑煞車曲線衝過目標隨機 100~200px，觸發沉重撞擊音效（Clank）。
     * 3. 階段二（多階漸層張力反彈 0.9x -> 0.7x -> 0.4x -> 0.1x）：
     *    向上反彈縮回隨機 100px ~ 200px 時，動畫時間漸層放慢至約 0.1 倍，
     *    讓全班屏氣凝神注視名字從眼前緩緩反彈上升，隨後精準咬死卡榫在中央 0px（Snap），
     *    帶來張力十足的課堂檢定氣氛！
     */
    function spinPhysicsReel(bandElem, orderedBaseList, fromItem, targetItem, renderFn, durationMs, onStop) {
      const N = orderedBaseList.length;
      if (N === 0) return;

      let fromIdx = orderedBaseList.findIndex(it => (it.id || it) === (targetItem.id || targetItem));
      let toIdx = orderedBaseList.findIndex(it => (it.id || it) === (targetItem.id || targetItem));
      if (fromIdx < 0) fromIdx = 0;
      if (toIdx < 0) toIdx = 0;

      // 保證經過的循環圈數
      const fullLoops = 6;
      let stepsForward = (toIdx - fromIdx + N) % N;
      if (stepsForward === 0) stepsForward = N;
      const totalSteps = (fullLoops * N) + stepsForward;

      const PRE_ITEMS = 3;
      const sequence = [];
      for (let s = -PRE_ITEMS; s <= totalSteps + POST_BUFFER_COUNT; s++) {
        const idx = (fromIdx + s + (N * 50)) % N;
        sequence.push(orderedBaseList[idx]);
      }

      buildReelDOM(bandElem, sequence, renderFn);

      const containerHeight = bandElem.parentElement.clientHeight || (ITEM_HEIGHT * 3);
      const centerOffset = (containerHeight / 2) - (ITEM_HEIGHT / 2);
      const startY = -(PRE_ITEMS * ITEM_HEIGHT) + centerOffset;
      bandElem.style.transition = 'none';
      bandElem.style.transform = `translateY(${startY}px)`;
      void bandElem.offsetHeight;

      const targetSeqIndex = PRE_ITEMS + totalSteps;
      const finalCenterY = -(targetSeqIndex * ITEM_HEIGHT) + centerOffset;

      // 齒輪聲
      const tickInterval = Math.max(24, Math.floor(durationMs / Math.min(totalSteps, 45)));
      const tickTimer = setInterval(() => {
        AudioEngine.click();
      }, tickInterval);

      // 隨機衝刺與反彈參數 (100px ~ 200px)
      const OVERSHOOT_PX = Math.floor(Math.random() * (200 - 100 + 1)) + 100;
      const REBOUND_PX = Math.floor(Math.random() * (200 - 100 + 1)) + 100;

      const phase1Time = durationMs - 450;
      const bottomY = finalCenterY - OVERSHOOT_PX;

      // 階段一：強勁速度向下衝過目標線 100~200px
      bandElem.style.transition = `transform ${phase1Time}ms cubic-bezier(0.12, 0.96, 0.28, 1.0)`;
      bandElem.style.transform = `translateY(${bottomY}px)`;

      setTimeout(() => {
        clearInterval(tickTimer);
        AudioEngine.clankStage1();
        triggerShock();

        // 階段二：向上反彈縮回 REBOUND_PX，並以 4 階段漸層減速（0.9x -> 0.7x -> 0.4x -> 0.1x 極致慢速拉扯）
        const totalReboundLift = OVERSHOOT_PX + REBOUND_PX; // 從衝刺最低點向上拉升總量

        // 4段式位移分配與時間計算（模擬物理阻尼與極速慢動作張力）
        // 段1 (0.9x): 爬升 35% 行程，歷時 180ms
        const step1Lift = totalReboundLift * 0.35;
        const step1Time = 180;

        // 段2 (0.7x): 接續爬升 30% 行程，歷時 260ms
        const step2Lift = totalReboundLift * 0.30;
        const step2Time = 260;

        // 段3 (0.4x): 接續爬升 20% 行程，歷時 420ms
        const step3Lift = totalReboundLift * 0.20;
        const step3Time = 420;

        // 段4 (0.1x 超慢速張力凝結): 最後 15% 行程，放慢至約 0.1 倍速，歷時 880ms
        const step4Lift = totalReboundLift * 0.15;
        const step4Time = 880;

        // --- Step 1 (0.9x) ---
        const pos1 = bottomY + step1Lift;
        bandElem.style.transition = `transform ${step1Time}ms cubic-bezier(0.25, 0.8, 0.4, 1.0)`;
        bandElem.style.transform = `translateY(${pos1}px)`;

        setTimeout(() => {
          // --- Step 2 (0.7x) ---
          const pos2 = pos1 + step2Lift;
          bandElem.style.transition = `transform ${step2Time}ms cubic-bezier(0.22, 0.7, 0.35, 1.0)`;
          bandElem.style.transform = `translateY(${pos2}px)`;

          setTimeout(() => {
            // --- Step 3 (0.4x) ---
            const pos3 = pos2 + step3Lift;
            bandElem.style.transition = `transform ${step3Time}ms cubic-bezier(0.2, 0.6, 0.3, 1.0)`;
            bandElem.style.transform = `translateY(${pos3}px)`;

            setTimeout(() => {
              // --- Step 4 (0.1x 極致慢速凝視階段) ---
              const pos4 = pos3 + step4Lift; // 即 finalCenterY + REBOUND_PX
              bandElem.style.transition = `transform ${step4Time}ms cubic-bezier(0.16, 0.5, 0.25, 1.0)`;
              bandElem.style.transform = `translateY(${pos4}px)`;

              setTimeout(() => {
                // 終末：平滑阻尼咬死鎖定在中央對齊線 0px
                const settleTime = 240;
                bandElem.style.transition = `transform ${settleTime}ms cubic-bezier(0.18, 0.89, 0.32, 1.28)`;
                bandElem.style.transform = `translateY(${finalCenterY}px)`;

                setTimeout(() => {
                  AudioEngine.snapStage2();
                  triggerShock();

                  // 滾動完全定格後，靜態還原 DOM 飽滿視野，確保上下相鄰文字清晰完整
                  setupReelStaticView(bandElem, orderedBaseList, targetItem, renderFn);

                  if (onStop) onStop(targetItem);
                }, settleTime + 20);

              }, step4Time);

            }, step3Time);

          }, step2Time);

        }, step1Time);

      }, phase1Time);
    }

    function triggerShock() {
      appBody.classList.remove('shock-effect');
      void appBody.offsetWidth;
      appBody.classList.add('shock-effect');
    }

    function setBusy(busy) {
      isSpinning = busy;
      spinMainBtn.disabled = busy;
      spinClassStepBtn.disabled = busy;
      toggleAllClassBtn.disabled = busy;
      document.querySelectorAll('.class-filter-check').forEach(c => c.disabled = busy);

      if (busy) {
        spinMainBtn.classList.add('opacity-40', 'cursor-not-allowed');
        spinClassStepBtn.classList.add('opacity-40', 'cursor-not-allowed');
        spinStudentStepBtn.disabled = true;
        spinStudentStepBtn.classList.add('opacity-40', 'cursor-not-allowed');
      } else {
        spinMainBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        spinClassStepBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        if (appMode === 'twoStep' && lockedClass && enabledClasses.has(lockedClass)) {
          spinStudentStepBtn.disabled = false;
          spinStudentStepBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        }
      }
    }

    // 機械拉桿手感
    function pullLever() {
      if (isSpinning) return;
      AudioEngine.lever();
      leverControl.classList.add('lever-pulled');
      
      setTimeout(() => {
        leverControl.classList.remove('lever-pulled');
        AudioEngine.leverReturn();
        executeMainSpin();
      }, 260);
    }

    // ==========================================
    // 抽籤邏輯實作
    // ==========================================

    // 方式一：先選班級
    function executeTwoStepClassSpin(onFinish) {
      const eligibleClasses = getEligibleClasses();
      if (eligibleClasses.length === 0) {
        finalResultBanner.textContent = '無可用班級或學生已全數抽完';
        return;
      }

      setBusy(true);
      statusTension.textContent = '⚡ 滾筒一順序滾動中';
      classStatusLabel.textContent = '滾動中';

      const chosenClass = eligibleClasses[Math.floor(Math.random() * eligibleClasses.length)];

      spinPhysicsReel(
        reelClassBand,
        eligibleClasses,
        currentClassItem,
        chosenClass,
        renderClassItemHTML,
        2100,
        (targetCls) => {
          currentClassItem = targetCls;
          lockedClass = targetCls;
          classStatusLabel.textContent = `鎖定：${targetCls}`;
          statusTension.textContent = `鎖定【${targetCls}】，準備座號`;

          // 更新右側學生輪盤視野為該班級全體學生
          const classStudents = STUDENTS.filter(s => s.class === targetCls).sort((a, b) => a.seat - b.seat);
          currentStudentItem = classStudents[0];
          setupReelStaticView(reelStudentBand, classStudents, currentStudentItem, renderStudentItemHTML);

          renderClassCheckboxes();
          setBusy(false);

          spinStudentStepBtn.disabled = false;
          spinStudentStepBtn.classList.remove('opacity-40', 'cursor-not-allowed');

          if (onFinish) onFinish(targetCls);
        }
      );
    }

    // 方式一：再選學生
    function executeTwoStepStudentSpin(onFinish) {
      if (!lockedClass || !enabledClasses.has(lockedClass)) {
        finalResultBanner.textContent = '請先抽取有效班級';
        return;
      }
      const candidates = getRemaining(lockedClass);
      if (candidates.length === 0) {
        finalResultBanner.textContent = `【${lockedClass}】已無候選人`;
        return;
      }

      setBusy(true);
      statusTension.textContent = '🔥 滾筒二順序滾動中';
      studentStatusLabel.textContent = '滾動中';

      const classStudents = STUDENTS.filter(s => s.class === lockedClass).sort((a, b) => a.seat - b.seat);
      const chosenStudent = candidates[Math.floor(Math.random() * candidates.length)];

      spinPhysicsReel(
        reelStudentBand,
        classStudents,
        currentStudentItem,
        chosenStudent,
        renderStudentItemHTML,
        2500,
        (targetStudent) => {
          currentStudentItem = targetStudent;
          if (noRepeatToggle.checked) {
            drawnIds.add(targetStudent.id);
          }

          studentStatusLabel.textContent = `命中：${targetStudent.seat}號`;
          statusTension.textContent = '🎯 命中確立';
          finalResultBanner.textContent = `${targetStudent.class} ${targetStudent.seat}號 ${targetStudent.name}`;

          if (typeof confetti === 'function') {
            confetti({
              particleCount: 90,
              spread: 80,
              origin: { y: 0.6 },
              colors: ['#dc2626', '#000000', '#f59e0b']
            });
          }

          addHistory(targetStudent);
          renderClassCheckboxes();
          setBusy(false);

          if (onFinish) onFinish(targetStudent);
        }
      );
    }

    // 方式二：直接隨機選學生
    function executeDirectSpin() {
      const candidates = getRemaining();
      if (candidates.length === 0) {
        finalResultBanner.textContent = '無符合之候選學生';
        return;
      }

      setBusy(true);
      statusTension.textContent = '🔥 雙滾輪連續高速運轉';
      classStatusLabel.textContent = '順序滾動';
      studentStatusLabel.textContent = '順序滾動';

      const chosenStudent = candidates[Math.floor(Math.random() * candidates.length)];
      lockedClass = chosenStudent.class;

      const validClasses = getEligibleClasses();

      // 滾筒 1 班級滾動 (1800ms)
      spinPhysicsReel(
        reelClassBand,
        validClasses,
        currentClassItem,
        chosenStudent.class,
        renderClassItemHTML,
        1800,
        (targetCls) => {
          currentClassItem = targetCls;
          classStatusLabel.textContent = `命中：${targetCls}`;
        }
      );

      // 滾筒 2 學生名冊滾動 (2600ms)
      const allActiveStudents = STUDENTS.filter(s => enabledClasses.has(s.class)).sort((a, b) => a.id.localeCompare(b.id));
      spinPhysicsReel(
        reelStudentBand,
        allActiveStudents,
        currentStudentItem,
        chosenStudent,
        renderStudentItemHTML,
        2600,
        (targetStudent) => {
          currentStudentItem = targetStudent;
          if (noRepeatToggle.checked) {
            drawnIds.add(targetStudent.id);
          }

          studentStatusLabel.textContent = `命中：${targetStudent.seat}號`;
          statusTension.textContent = '🎯 命中確立';
          finalResultBanner.textContent = `${targetStudent.class} ${targetStudent.seat}號 ${targetStudent.name}`;

          if (typeof confetti === 'function') {
            confetti({
              particleCount: 90,
              spread: 80,
              origin: { y: 0.6 },
              colors: ['#dc2626', '#000000', '#f59e0b']
            });
          }

          addHistory(targetStudent);
          renderClassCheckboxes();
          setBusy(false);
        }
      );
    }

    // 主開始鈕
    function executeMainSpin() {
      if (isSpinning) return;
      if (appMode === 'twoStep') {
        executeTwoStepClassSpin(() => {
          setTimeout(() => {
            executeTwoStepStudentSpin();
          }, 350);
        });
      } else {
        executeDirectSpin();
      }
    }

    // ==========================================
    // 歷史紀錄處理
    // ==========================================
    function addHistory(student) {
      const time = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
      historyRecords.unshift({ ...student, time });
      renderHistory();
    }

    function renderHistory() {
      historyCount.textContent = `${historyRecords.length}人`;
      if (historyRecords.length === 0) {
        historyBar.innerHTML = '<span class="text-gray-400 italic text-[11px]">尚無紀錄</span>';
        return;
      }
      historyBar.innerHTML = historyRecords.map(item => `
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-neutral-100 border border-gray-900 text-[11px] font-mono flex-shrink-0">
          <span class="text-gray-600">${item.class}</span>
          <span class="font-bold text-black">${item.seat}號</span>
          <span class="font-iansui font-black text-black">${item.name}</span>
          <span class="text-gray-400 text-[10px]">${item.time}</span>
        </span>
      `).join('');
    }

    function resetAllState() {
      drawnIds.clear();
      lockedClass = null;
      classStatusLabel.textContent = '--';
      studentStatusLabel.textContent = '--';
      finalResultBanner.textContent = '等待拉霸';
      statusTension.textContent = '拉霸待命';
      currentClassItem = ALL_CLASSES[0];
      currentStudentItem = STUDENTS[0];
      setupReelStaticView(reelClassBand, ALL_CLASSES, currentClassItem, renderClassItemHTML);
      setupReelStaticView(reelStudentBand, STUDENTS, currentStudentItem, renderStudentItemHTML);
      renderClassCheckboxes();
    }

    // ==========================================
    // 介面事件綁定
    // ==========================================
    modeTwoStepBtn.addEventListener('click', () => {
      if (isSpinning) return;
      appMode = 'twoStep';
      modeTwoStepBtn.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-white text-black shadow-sm border border-gray-900';
      modeDirectBtn.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-black';
      systemModeLabel.textContent = '模式：先選班級，再選學生';
      spinClassStepBtn.style.display = 'inline-block';
      spinStudentStepBtn.style.display = 'inline-block';
      refreshCurrentStudentReel();
    });

    modeDirectBtn.addEventListener('click', () => {
      if (isSpinning) return;
      appMode = 'direct';
      modeDirectBtn.className = 'px-2.5 py-1 text-xs font-bold rounded-md bg-white text-black shadow-sm border border-gray-900';
      modeTwoStepBtn.className = 'px-2.5 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-black';
      systemModeLabel.textContent = '模式：直接隨機選學生';
      spinClassStepBtn.style.display = 'none';
      spinStudentStepBtn.style.display = 'none';
      refreshCurrentStudentReel();
    });

    leverControl.addEventListener('click', pullLever);
    spinMainBtn.addEventListener('click', () => {
      pullLever();
    });

    spinClassStepBtn.addEventListener('click', () => {
      if (!isSpinning) executeTwoStepClassSpin();
    });
    spinStudentStepBtn.addEventListener('click', () => {
      if (!isSpinning) executeTwoStepStudentSpin();
    });

    resetPoolBtn.addEventListener('click', resetAllState);
    clearHistoryBtn.addEventListener('click', () => {
      historyRecords = [];
      renderHistory();
    });

    noRepeatToggle.addEventListener('change', renderClassCheckboxes);
    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
    });

    window.addEventListener('keydown', (e) => {
      if (lockScreen.style.display !== 'none') return;
      if ((e.code === 'Space' || e.code === 'Enter') && !isSpinning) {
        e.preventDefault();
        pullLever();
      }
    });

    // 初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      renderClassCheckboxes();
      setupReelStaticView(reelClassBand, ALL_CLASSES, currentClassItem, renderClassItemHTML);
      setupReelStaticView(reelStudentBand, STUDENTS, currentStudentItem, renderStudentItemHTML);
      pwdInput.focus();
    });
  </script>
</body>
